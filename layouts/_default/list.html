{{ define "main" }}
<div class="mb-10">
  <h1 class="text-3xl font-mono font-bold text-[var(--color-text-primary)]">
    <span class="text-[var(--color-accent-cyan)]">&gt;</span> {{ .Title }}
  </h1>
  {{ with .Description }}
  <p class="mt-2 text-[var(--color-text-secondary)]">{{ . }}</p>
  {{ end }}
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  {{ range .Pages }}
  {{ partial "project-card.html" . }}
  {{ end }}
</div>
{{ end }}
